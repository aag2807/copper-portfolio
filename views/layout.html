<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} — Alvaro Guzman</title>
    <meta name="description" content="{{#if description}}{{description}}{{else}}Alvaro Guzman — software engineer from the Dominican Republic. Portfolio served from a hand-written C MVC framework with a wasmoon-driven Lua runtime in the browser.{{/if}}" />
    <meta name="author" content="Alvaro Guzman" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.45)); }
        50%      { opacity: 1;    filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.85)); }
      }
      .glow-green { animation: pulse-glow 3s infinite; }
      .nav-scroll { scrollbar-width: none; -ms-overflow-style: none; }
      .nav-scroll::-webkit-scrollbar { display: none; }
      .nav-scroll {
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
                mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
      }
      @media (min-width: 640px) {
        .nav-scroll { -webkit-mask-image: none; mask-image: none; }
      }
    </style>
    <script defer src="/static/alpine.js"></script>
    <script defer src="/static/framework/lua-framework.js"></script>
  </head>
  <body
    class="min-h-[100dvh] flex flex-col bg-[#0A0A0B] text-[#D1D1D1] font-sans selection:bg-emerald-500 selection:text-neutral-950"
    {{#if luaModule}}data-lua-module="{{luaModule}}"{{/if}}
  >
    <header class="border-b border-slate-800 bg-[#121214] sticky top-0 z-50">
      <!-- Row 1: identity + build tag -->
      <div class="h-10 flex items-center justify-between gap-3 px-4 sm:px-6 border-b border-slate-800/60">
        <a href="/" class="flex items-center space-x-3 select-none group shrink-0 min-w-0">
          <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full glow-green shrink-0"></span>
          <span class="font-mono text-xs tracking-widest text-slate-400 uppercase group-hover:text-white transition-colors truncate">
            <span class="hidden xs:inline sm:inline">ALVARO_GUZMAN // SYSTEMS_PORTFOLIO</span>
            <span class="sm:hidden">A_GUZMAN // PORTFOLIO</span>
          </span>
        </a>
        <span class="text-[10px] font-mono text-slate-500 shrink-0">c-copper v0.03 // DO</span>
      </div>
      <!-- Row 2: nav -->
      <nav class="nav-scroll h-10 flex items-center gap-5 overflow-x-auto px-4 sm:px-6">
        <a href="/"        class="shrink-0 text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">01_Home</a>
        <a href="/systems" class="shrink-0 text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">02_Systems</a>
        <a href="/gamedev" class="shrink-0 text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">03_Gamedev</a>
        <a href="/web"     class="shrink-0 text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">04_Web</a>
        <a href="/ai"       class="shrink-0 text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">05_AI</a>
        <a href="/workshop" class="shrink-0 text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">06_Workshop</a>
        <a href="/contact"  class="shrink-0 text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">07_Connect</a>
      </nav>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 md:py-12 flex flex-col gap-8">
      {{body}}
    </main>

    <footer class="h-10 bg-emerald-500 px-6 flex items-center justify-between text-black font-mono text-[10px] font-bold uppercase shrink-0 select-none">
      <div class="flex space-x-6">
        <span>Operator: Alvaro Guzman</span>
        <span class="hidden sm:inline">Origin: Santo Domingo, DO</span>
        <span class="hidden md:inline">Runtime: c-copper / wasmoon-lua</span>
      </div>
      <div class="flex items-center">
        <span class="mr-2">System_Health</span>
        <div class="flex space-x-1">
          <div class="w-1.5 h-3 bg-black/20"></div>
          <div class="w-1.5 h-3 bg-black/40"></div>
          <div class="w-1.5 h-3 bg-black/60"></div>
          <div class="w-1.5 h-3 bg-black"></div>
        </div>
      </div>
    </footer>
  </body>
</html>
