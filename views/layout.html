<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} // C_COPPER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.45)); }
        50%      { opacity: 1;    filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.85)); }
      }
      .glow-green { animation: pulse-glow 3s infinite; }
    </style>
    <script defer src="/static/alpine.js"></script>
    <script defer src="/static/framework/lua-framework.js"></script>
  </head>
  <body
    class="min-h-[100dvh] flex flex-col bg-[#0A0A0B] text-[#D1D1D1] font-sans selection:bg-emerald-500 selection:text-neutral-950"
    {{#if luaModule}}data-lua-module="{{luaModule}}"{{/if}}
  >
    <header class="h-14 sm:h-12 flex flex-col sm:flex-row items-center justify-between px-6 border-b border-slate-800 bg-[#121214] sticky top-0 z-50 gap-2 sm:gap-0">
      <a href="/" class="flex items-center space-x-3 select-none group">
        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full glow-green"></span>
        <span class="font-mono text-xs tracking-widest text-slate-400 uppercase group-hover:text-white transition-colors">
          C_COPPER // MVC_RUNTIME
        </span>
      </a>
      <div class="flex items-center space-x-6 sm:space-x-8">
        <nav class="flex items-center space-x-5">
          <a href="/"        class="text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">01_Home</a>
          <a href="/systems" class="text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">02_Systems</a>
          <a href="/gamedev" class="text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">03_Gamedev</a>
          <a href="/web"     class="text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">04_Web</a>
          <a href="/contact" class="text-xs font-mono uppercase tracking-tighter text-slate-400 hover:text-emerald-400 transition-colors">05_Connect</a>
        </nav>
        <div class="hidden md:block h-4 w-px bg-slate-700"></div>
        <span class="hidden md:inline text-[10px] font-mono text-slate-500">v0.02-dev</span>
      </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 md:py-12 flex flex-col gap-8">
      {{body}}
    </main>

    <footer class="h-10 bg-emerald-500 px-6 flex items-center justify-between text-black font-mono text-[10px] font-bold uppercase shrink-0 select-none">
      <div class="flex space-x-6">
        <span>Backend: C99 / Pthreads</span>
        <span class="hidden sm:inline">Bind: 0.0.0.0:8080</span>
        <span class="hidden md:inline">Runtime: Wasmoon-Lua 5.4</span>
      </div>
      <div class="flex items-center">
        <span class="mr-2">System_Health</span>
        <div class="flex space-x-1">
          <div class="w-1.5 h-3 bg-black/20"></div>
          <div class="w-1.5 h-3 bg-black/40"></div>
          <div class="w-1.5 h-3 bg-black/60"></div>
          <div class="w-1.5 h-3 bg-black"></div>
        </div>
      </div>
    </footer>
  </body>
</html>
